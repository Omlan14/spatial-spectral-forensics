# Research State — Central Project Tracking
# Updated by the agent after each experiment and outer-loop reflection.
# Source of truth: src/experimental-pipeline.md (locked v1.0, 2026-09-14).

project:
  title: "Interpreting Spatial-Frequency Features for AI-Generated Image Detection Under Generator Shift and JPEG Compression"
  question: >-
    With the same processing applied to both classes and a strict split by image
    group, which simple feature set separates real photographs from AI-generated
    images best: pixel-pattern features, frequency (spectrum) features, or both
    combined? And how much does the answer change when (a) both classes are
    JPEG-compressed, and (b) the test set uses an image generator the study never
    trained on?
  status: active                  # active | paused | concluded
  started: "2026-09-14"           # pipeline locked
  domain: "digital image processing / image forensics / frequency-domain analysis"

literature:
  reference_set: 20               # all verified 2026-09-14 (see literature/literature-review.md)
  review_file: "literature/literature-review.md"
  bib_file: "literature/references.bib"
  key_papers:
    - id: "grommelt2024fake"
      num: 1
      title: "Fake or JPEG? Revealing Common Biases in Generated Image Detection Datasets"
      authors: "Grommelt et al."
      year: 2024
      relevance: "Closest JPEG-bias study; justifies matched JPEG (C1), mismatch control (C2), per-file history record."
    - id: "guillaro2025bfree"
      num: 2
      title: "A Bias-Free Training Paradigm for More General AI-generated Image Detection (B-Free)"
      authors: "Guillaro et al."
      year: 2025
      relevance: "Same final format is not the same history; justifies file provenance record."
    - id: "gye2025sfld"
      num: 3
      title: "SFLD: Reducing the Content Bias for AI-Generated Image Detection"
      authors: "Gye et al."
      year: 2025
      relevance: "Why content bias (H5) is not tested; cited in limitations."
    - id: "yan2025sanity"
      num: 4
      title: "A Sanity Check for AI-generated Image Detection"
      authors: "Yan et al."
      year: 2025
      relevance: "Hard benchmarks break detectors; supports careful claims."
    - id: "frank2020leveraging"
      num: 5
      title: "Leveraging Frequency Analysis for Deep Fake Image Recognition"
