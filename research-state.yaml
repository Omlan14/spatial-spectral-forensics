    - id: "ricker2024aeroblade"
      num: 18
      title: "AEROBLADE: Training-Free Detection of Latent Diffusion Images Using Autoencoder Reconstruction Error"
      authors: "Ricker et al."
      year: 2024
      relevance: "Reconstruction context, cited not implemented."
    - id: "wang2023dire"
      num: 19
      title: "DIRE for Diffusion-Generated Image Detection"
      authors: "Wang et al."
      year: 2023
      relevance: "Standard reconstruction-discrepancy method; boundary context."
    - id: "chu2025fire"
      num: 20
      title: "FIRE: Robust Detection of Diffusion-Generated Images via Frequency-Guided Reconstruction Error"
      authors: "Chu et al."
      year: 2025
      relevance: "Clearest example of the cost class not entered (frequency + reconstruction)."
  open_problems:
    - "No retrieved work establishes a universal winner between simple feature sets under one fair, matched procedure."
    - "JPEG-bias evidence is at the detector level; per-feature gain/loss of separation is not reported."
  evidence_gaps:
    - "Per-feature stability vs. separation under matched JPEG compression is not reported in the retrieved literature."
    - "Joint unseen-generator + JPEG evaluation on explainable, pre-registered feature sets is not reported in retrieved abstracts."

hypotheses:
  # Fresh hypotheses (locked 2026-09-14 in src/experimental-pipeline.md Section 7).
  - id: H1
    statement: "At least one feature arm (pixel-pattern, frequency, combined) separates real from AI-generated images on the clean condition (E1, C0)."
    status: pending                # pending | active | supported | refuted | inconclusive
    motivation: "First check: does any signal exist before interpreting anything else."
    parent: null
    priority: high
    decision_rule: "Supported if at least one arm shows a confidence interval excluding chance."
  - id: H2
    statement: "A deliberate mismatch (C2) changes separation relative to matched conditions (E1/E3)."
    status: pending
    motivation: "Control: shows a careless pipeline can 'detect' processing instead of content."
    parent: null
    priority: high
    decision_rule: "Supported only if separation changes in the predicted direction with a group-based CI. Wording: 'the separation changed after the controlled change'."
  - id: H3
    statement: "Broad-spectrum frequency features (8-11, 13) behave differently from a narrow peak feature (14), judged on stability and on separation separately."
    status: pending
    motivation: "Splits the verdict in two; never merges 'values changed' with 'classification got worse'."
    parent: null
    priority: medium
    decision_rule: "Two separate verdicts: (a) feature-value stability, (b) classification separation."
  - id: H4
    statement: "Detection degrades on a generator family never seen in training (E4/E5)."
    status: pending
    motivation: "Generator shift is a published, measured phenomenon."
    parent: null
    priority: high
    decision_rule: "Read from per-generator rows of E4/E5; claims apply only to the tested families."
  - id: H5
    statement: "Detection depends on image content (content bias)."
    status: not-tested             # deferred by design; documented in limitations
    motivation: "Needs content-matched construction (TwinSynths-style), out of scope."
    parent: null
    priority: low
    decision_rule: "Not tested. One limitations paragraph citing [3] and [2]."

